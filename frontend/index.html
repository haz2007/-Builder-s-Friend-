<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a2a1f" />
    <!-- .ico — для Яндекса и старых браузеров, PNG 120×120 — значок в выдаче Яндекса -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="120x120" href="/favicon-120.png" />
    <link rel="apple-touch-icon" href="/brand/logo-telegram.png" />

    <!--
      Заголовок, описание, превью ссылки и разметка schema.org — свои для каждой
      страницы. Caddy (директива templates в frontend/Caddyfile) вставляет сюда
      ответ /api/v1/seo/head, поэтому поисковик видит их без JavaScript.
      При `npm run dev` блок заменяется тегами по умолчанию (vite.config.ts).
    -->
    <!-- seo:start -->
    {{httpInclude (printf "/api/v1/seo/head?path=%s&host=%s&scheme=%s" (urlquery .OriginalReq.URL.Path) (urlquery .Req.Host) (placeholder "http.request.scheme"))}}
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
