version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wood_commerce_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wood_commerce
    ports:
      - "5110:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
