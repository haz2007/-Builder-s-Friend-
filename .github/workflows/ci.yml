name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Новый пуш в PR отменяет старую проверку, а на main — нет: иначе можно оборвать выкатку
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — линтер, типы, тесты
    runs-on: ubuntu-latest
    services:
      # Та же база и порт, что и локально (tests/conftest.py)
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wood_commerce_test
        ports:
          - 5110:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check .
      - name: Проверка типов (mypy)
        working-directory: backend
        run: mypy
      - name: Одна ветка миграций
        working-directory: backend
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Тесты
        run: python -m pytest -q

  frontend:
    name: Frontend — линтер, тесты, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E — покупка и обработка заказа
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wood_commerce_e2e
        ports:
          - 5110:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker — сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образов продакшена
        env:
          POSTGRES_PASSWORD: ci
          SECRET_KEY: ci
        run: docker compose -f docker-compose.prod.yml build

  deploy:
    name: Выкатка на сервер
    needs: [backend, frontend, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # Публичный ключ сервера (не секрет): защищает от подмены сервера
      DEPLOY_HOST_KEY: "132.243.190.59 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO8sDOm2X0Ji1rWRByITGwvCJ6Ws/d39ozxuJyV0DS+t"
    steps:
      - uses: actions/checkout@v4
      - name: Ключ для выкатки не задан
        if: env.DEPLOY_SSH_KEY == ''
        run: echo "::notice::Секрет DEPLOY_SSH_KEY не задан — выкатка пропущена"
      - name: Код на сервер (scripts/deploy.sh)
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          git archive --format=tar HEAD | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 root@132.243.190.59 "commit ${GITHUB_SHA::7}"
