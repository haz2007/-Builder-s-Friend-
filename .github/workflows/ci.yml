name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — линтер, типы, тесты
    runs-on: ubuntu-latest
    services:
      # Та же база и порт, что и локально (tests/conftest.py)
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wood_commerce_test
        ports:
          - 5110:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check .
      - name: Проверка типов (mypy)
        working-directory: backend
        run: mypy
      - name: Одна ветка миграций
        working-directory: backend
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Тесты
        run: python -m pytest -q

  frontend:
    name: Frontend — линтер и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker — сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образов продакшена
        env:
          POSTGRES_PASSWORD: ci
          SECRET_KEY: ci
        run: docker compose -f docker-compose.prod.yml build
